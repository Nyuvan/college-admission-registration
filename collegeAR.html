<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Admission Registration Form</title>
  <link rel="stylesheet" href="collegeAR.css">
</head>
<body>

  <div class="container">
    <h1>College Admission Registration Form</h1>
    <p>Fill in your details below to apply for admission. Fields marked with * are required.</p>

    <form action="#" method="post" enctype="multipart/form-data">

      <fieldset>
        <legend>Personal Information</legend>

        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" name="fullName" minlength="3" required>

        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="dob">Date of Birth *</label>
        <input type="date" id="dob" name="dob" required>

        <label>Gender *</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <label for="password">Password *</label>
        <input type="password" id="password" name="password" minlength="8" required>

        <label for="address">Address *</label>
        <textarea id="address" name="address" rows="4" required></textarea>

        <label for="photo">Photograph *</label>
        <input type="file" id="photo" name="photo" required>
      </fieldset>

      <fieldset>
        <legend>Academic Details</legend>

        <label for="documents">Supporting Documents *</label>
        <input type="file" id="documents" name="documents" multiple required>
      </fieldset>

      <fieldset>
        <legend>Course Preferences</legend>

        <label for="course">Course *</label>
        <select id="course" name="course" required>
          <option value="" disabled selected>Select a course</option>
          <option value="cse">B.Tech CSE</option>
          <option value="aiml">B.Tech AI/ML</option>
          <option value="bba">BBA</option>
          <option value="bca">BCA</option>
        </select>

        <label>Interests</label>
        <input type="checkbox" id="coding" name="interests" value="coding">
        <label for="coding">Coding</label>
        <input type="checkbox" id="sports" name="interests" value="sports">
        <label for="sports">Sports</label>
        <input type="checkbox" id="music" name="interests" value="music">
        <label for="music">Music</label>
        <input type="checkbox" id="reading" name="interests" value="reading">
        <label for="reading">Reading</label>
      </fieldset>

      <div class="declaration">
        <input type="checkbox" id="declaration" name="declaration" required>
        <label for="declaration">I declare that the information given above is true and correct. *</label>
      </div>

      <input type="submit" value="Submit">
      <input type="reset" value="Reset">
    </form>
  </div>

</body>
</html>
